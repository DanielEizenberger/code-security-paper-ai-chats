{% extends 'base.html' %}

{% block content %}

<h1>Club News Feed</h1>

{% for post in posts %}
<div class="post-card">
    <h2>{{ post.title }}</h2>

    <p>{{ post.content }}</p>

    <small>
        Posted by {{ post.author.username }}
        on {{ post.created_at.strftime('%Y-%m-%d %H:%M') }}
    </small>
</div>
{% endfor %}

{% endblock %}
