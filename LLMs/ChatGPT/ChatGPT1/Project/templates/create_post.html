{% extends "base.html" %}

{% block content %}
<h1>Create Post</h1>

<form method="POST">

    <input
        type="text"
        name="title"
        placeholder="Title"
        required
    >

    <textarea
        name="content"
        placeholder="Write your update..."
        required
    ></textarea>

    <button type="submit">Publish</button>

</form>
{% endblock %}
