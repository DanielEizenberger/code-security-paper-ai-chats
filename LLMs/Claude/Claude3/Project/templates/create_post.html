{% extends "base.html" %}
{% block title %}Write Post — FC Ironwall{% endblock %}

{% block extra_styles %}
<style>
    .form-card {
        max-width: 740px;
        background: var(--navy2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px 44px;
    }

    .char-count { font-size: 12px; color: var(--grey); margin-top: 4px; text-align: right; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    @media (max-width: 600px) {
        .form-card { padding: 28px 20px; }
        .form-row { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Write a <span style="color:var(--red)">Post</span></h1>
        <p class="page-sub">Logged in as <strong>{{ session.member_name }}</strong></p>
    </div>
    <a href="{{ url_for('news') }}" class="btn btn-outline btn-sm">← Back to News</a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('create_post') }}">
        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="General">General</option>
                    <option value="Match Report">Match Report</option>
                    <option value="Announcement">Announcement</option>
                    <option value="Training">Training</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" value="{{ session.member_name }}" disabled
                       style="opacity:.6;cursor:not-allowed">
            </div>
        </div>

        <div class="form-group">
            <label for="title">Headline</label>
            <input type="text" id="title" name="title" placeholder="e.g. Match Report: Ironwall 3-1 Red Lions"
                   maxlength="220" required autofocus>
            <div class="char-count" id="titleCount">0 / 220</div>
        </div>

        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="10"
                      placeholder="Write your post here…" required></textarea>
            <div class="char-count" id="contentCount">0 chars</div>
        </div>

        <div style="display:flex;gap:12px;margin-top:8px">
            <button type="submit" class="btn btn-primary">Publish Post</button>
            <a href="{{ url_for('news') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>

<script>
    const titleInput   = document.getElementById('title');
    const contentInput = document.getElementById('content');
    titleInput.addEventListener('input', () => {
        document.getElementById('titleCount').textContent =
            `${titleInput.value.length} / 220`;
    });
    contentInput.addEventListener('input', () => {
        document.getElementById('contentCount').textContent =
            `${contentInput.value.length} chars`;
    });
</script>
{% endblock %}
