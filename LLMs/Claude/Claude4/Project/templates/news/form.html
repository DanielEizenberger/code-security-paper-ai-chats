{% extends 'base.html' %}
{% block title %}{{ 'Edit Post' if post else 'New Post' }} — FC Ironclad{% endblock %}
{% block content %}
<section class="section container-narrow">
  <h1 class="page-title">{{ 'Edit Post' if post else 'New Post' }}</h1>

  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

  <form method="POST" class="post-form">
    <div class="form-group">
      <label for="title">Headline</label>
      <input type="text" id="title" name="title" placeholder="Gripping headline…" required
             value="{{ post.title if post else request.form.get('title', '') }}">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category">
          {% for cat in categories %}
          <option value="{{ cat }}"
            {% if (post and post.category == cat) or request.form.get('category') == cat %}selected{% endif %}>
            {{ cat }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group" style="justify-content:flex-end; align-items:center; flex-direction:row; gap:.6rem;">
        <input type="checkbox" id="pinned" name="pinned"
               {% if (post and post.pinned) or request.form.get('pinned') %}checked{% endif %}>
        <label for="pinned" style="margin:0; font-weight:500; cursor:pointer;">📌 Pin this post</label>
      </div>
    </div>

    <div class="form-group">
      <label for="body">Content</label>
      <textarea id="body" name="body" rows="14" placeholder="Write your update…" required>{{ post.body if post else request.form.get('body', '') }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-green">{{ 'Update Post' if post else 'Publish Post' }}</button>
      <a href="{{ url_for('news.detail', post_id=post.id) if post else url_for('news.index') }}"
         class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
