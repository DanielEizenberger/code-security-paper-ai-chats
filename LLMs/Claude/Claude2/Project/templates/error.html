{% extends "base.html" %}
{% block title %}Error {{ code }} – FC Irongate{% endblock %}
{% block content %}
<div class="container">
  <div class="error-page">
    <div class="code">{{ code }}</div>
    <h2>{{ message }}</h2>
    <p>Something went wrong. Head back to the homepage.</p>
    <a href="{{ url_for('index') }}" class="btn-back">Back to Home</a>
  </div>
</div>
{% endblock %}
