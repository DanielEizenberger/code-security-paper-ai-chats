<!DOCTYPE html>
<html>
<head>
    <title>FC Champions - {% block title %}Home{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="container">
            <a href="/" class="logo">⚽ FC Champions</a>
            <div class="nav-links">
                <a href="/">News</a>
                <a href="/schedule.png" download>📅 Download Schedule (PNG)</a>
                {% if session.member_id %}
                    <a href="/dashboard">Member Dashboard</a>
                    <a href="/logout">Logout ({{ session.username }})</a>
                {% else %}
                    <a href="/login">Login</a>
                    <a href="/register">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
