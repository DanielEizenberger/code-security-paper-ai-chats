<!DOCTYPE html>
<html>
<head><title>Member Login</title>
<style>
    body { font-family: Arial; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .form-box { background: white; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
    button { background: #1e3c2c; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; cursor: pointer; }
    a { color: #1e3c2c; }
</style></head>
<body>
<div class="form-box">
    <h2>Member Login</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p style="margin-top: 15px;">Not a member? <a href="/register">Register here</a></p>
</div>
</body>
</html>
